<h2>Chương 76</h2>
<p>Người ta sinh ra thì mềm yếu mà khi chết thì cứng đơ.</p>
<p>Thảo mộc sinh ra thì mềm dịu mà khi chết thì khô cứng.</p>
<p>Cho nên cứng mạnh là cùng loài với chết, mềm yếu là cùng loài với sống.</p>
<p>Vì vậy binh mạnh thì không thắng, cây cứng thì bị chặt.</p>
<p>Cứng mạnh phải ở dưới, mềm yếu được ở trên.</p>
