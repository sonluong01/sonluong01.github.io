<h2>Chương 79</h2>
<p>Giải được cái oán lớn thì vẫn còn chút oán thừa ở trong lòng, như vậy sao gọi là phải?</p>
<p>Cho nên thánh nhân cầm phía bên trái tờ khế mà đời không nhận.</p>
<p>Người có đức thì cầm tờ khế, người không có đức thì đòi người ta phải trả.</p>
<p>Đạo trời không tư vị ai, chỉ gia ân cho người có đức.</p>
