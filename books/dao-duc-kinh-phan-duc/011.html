<h2>Chương 48</h2>
<p>Theo học thì mỗi ngày dục vọng và tinh thần hữu vi một tăng; theo đạo thì mỗi ngày dục vọng và tinh thần hữu vi một giảm.</p>
<p>Giảm rồi lại giảm cho tới mức vô vi, không làm.</p>
<p>Không làm mà không gì là không làm.</p>
<p>Trị thiên hạ thì nên vô vi, còn như hữu vi thì không trị được thiên hạ.</p>
