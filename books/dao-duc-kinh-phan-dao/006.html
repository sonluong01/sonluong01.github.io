<h2>Chương 6</h2>
<blockquote>
  <p>Cốc thần bất tử, thị vị huyền tẫn, huyền tẫn chi môn, thị vị thiên địa căn.</p>
  <p>Miên miên nhược tồn, dụng chi bất cần.</p>
</blockquote>
<p>Thần hang bất tử, gọi là Huyền Tẫn (Mẹ nhiệm màu); cửa Huyền Tẫn là gốc của trời đất.</p>
<p>Dằng dặc mà như bất tuyệt, tạo thành mọi vật mà không kiệt (hay không mệt).</p>
