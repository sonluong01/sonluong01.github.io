<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tủ sách</title>
<script>
/* apply saved theme before paint (no flash) */
(function(){try{var s=JSON.parse(localStorage.getItem('reader-settings'));
  if(s&&(s.theme==='dark'||s.theme==='light'))document.documentElement.setAttribute('data-theme',s.theme);
  if(s&&s.fontSize)document.documentElement.style.setProperty('--fs',s.fontSize+'px');
}catch(e){}})();
</script>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#dddbd1" id="meta-theme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tủ sách">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>

<!-- ===== Library ===== -->
<section id="view-library" class="view">
  <header class="lib-top">
    <h1 id="libTitle">Tủ sách</h1>
  </header>
  <nav id="crumb" class="crumb" hidden></nav>
  <div id="bookGrid" class="book-grid"></div>
  <p id="libEmpty" class="lib-empty" hidden>Đang tải danh sách sách…</p>
</section>

<!-- ===== Reader ===== -->
<section id="view-reader" class="view" hidden>
  <div id="topbar-progress"><i></i></div>
  <main id="content">
    <div class="prose" id="prose"></div>
    <nav class="chapnav">
      <button id="prevCh">‹ Chương trước</button>
      <button id="nextCh">Chương sau ›</button>
    </nav>
  </main>
</section>

<!-- ===== Bottom sheet (reader controls + chapters) ===== -->
<div id="hint" hidden>Chạm vào màn hình để mở mục lục</div>
<div id="overlay"></div>
<nav id="sheet" aria-label="Điều khiển đọc">
  <div class="grab"></div>
  <div class="sheet-head"><span id="sheetTitle">Mục lục</span><span id="sheetPct">0%</span></div>
  <div id="sheetBar"><i></i></div>
  <div class="actions">
    <button data-act="library"><span class="ic">≡</span><span>Tủ sách</span></button>
    <button data-act="theme"><span class="ic" id="themeIc">🌙</span><span>Sáng/Tối</span></button>
    <button data-act="fsdown"><span class="ic">A−</span><span>Nhỏ</span></button>
    <button data-act="fsup"><span class="ic">A＋</span><span>To</span></button>
  </div>
  <ul id="chapterList"></ul>
</nav>

<script src="app.js"></script>
</body>
</html>
